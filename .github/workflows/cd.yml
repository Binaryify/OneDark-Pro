name: CD

on: create
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:

  deploy:
    if: (github.event.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:

      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

        # Make sure the version number in the tag matches the version in package.json
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

        # Install deps, build, pack and deploy
      - name: Build
        run: npm ci && npx @vscode/vsce publish
        env:
          VSCE_PAT: ${{secrets.VSCE_PAT}}
